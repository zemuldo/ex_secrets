name: test

on:
  push:
  pull_request:

env:
  MIX_ENV: test

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # hackney 4.x requires OTP 27+ and HTTPoison 3.x requires Elixir 1.17+,
          # so those are the floor for a fresh dependency resolution.
          - elixir: "1.17.3"
            otp: "27.2"
          - elixir: "1.18.4"
            otp: "27.3.4"
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - name: Restore deps and build cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            priv/plts
          key: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-

      - run: printf 'JAVA=SCRIPT\nER=LANG\n' > .env

      - run: mix deps.get
      - run: mix check
      - run: mix test
